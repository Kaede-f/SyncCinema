global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    service: synccinema
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: synccinema
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          component: sync-server

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9101
        labels:
          component: host
